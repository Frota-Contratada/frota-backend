name: Build Backend Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build production image
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: frota-backend
      REDIS_IMAGE: frota-redis:7-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "archive=${IMAGE_NAME}-${SHORT_SHA}.tar" >> "$GITHUB_OUTPUT"
          echo "redis_archive=frota-redis-7-alpine.tar" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            --target runner \
            --build-arg BACKEND_PORT=3000 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_REPOSITORY}" \
            -t "${{ steps.meta.outputs.image }}" \
            .

      - name: Validate backend image
        run: |
          docker run \
            --rm \
            --entrypoint node \
            "${{ steps.meta.outputs.image }}" \
            -e "require('fs').accessSync('/app/dist/src/main.js')"

          docker run \
            --rm \
            --entrypoint node \
            "${{ steps.meta.outputs.image }}" \
            -e "require('fs').accessSync('/app/prisma/schema.prisma')"

      - name: Prepare Redis image
        run: |
          docker pull --platform linux/amd64 redis:7-alpine
          docker tag redis:7-alpine "${REDIS_IMAGE}"

      - name: Export images
        run: |
          mkdir -p artifact

          docker save \
            -o "artifact/${{ steps.meta.outputs.archive }}" \
            "${{ steps.meta.outputs.image }}"

          docker save \
            -o "artifact/${{ steps.meta.outputs.redis_archive }}" \
            "${REDIS_IMAGE}"

      - name: Create manifest
        shell: bash
        run: |
          cat > artifact/manifest.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "shortCommit": "${{ steps.meta.outputs.short_sha }}",
            "image": "${{ steps.meta.outputs.image }}",
            "archive": "${{ steps.meta.outputs.archive }}",
            "runtimeImages": {
              "redis": {
                "source": "redis:7-alpine",
                "image": "${REDIS_IMAGE}",
                "archive": "${{ steps.meta.outputs.redis_archive }}"
              }
            },
            "createdAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Generate checksums
        working-directory: artifact
        run: |
          sha256sum \
            "${{ steps.meta.outputs.archive }}" \
            > "${{ steps.meta.outputs.archive }}.sha256"

          sha256sum \
            "${{ steps.meta.outputs.redis_archive }}" \
            > "${{ steps.meta.outputs.redis_archive }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frota-backend-${{ steps.meta.outputs.short_sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo "## Backend runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: \`${{ steps.meta.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Redis: \`${REDIS_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`frota-backend-${{ steps.meta.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
