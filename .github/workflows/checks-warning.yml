name: Backend Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Validate backend
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=ci;user=ci;password=ci-placeholder;encrypt=true;trustServerCertificate=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: pnpm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        id: prisma_validate
        continue-on-error: true
        run: pnpm exec prisma validate

      - name: Generate Prisma Client
        id: prisma_generate
        continue-on-error: true
        run: pnpm exec prisma generate

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm run build

      - name: Validate entrypoint
        id: entrypoint
        continue-on-error: true
        shell: bash
        run: |
          test -f dist/src/main.js

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: pnpm test -- --runInBand

      - name: Validate production image
        id: docker
        continue-on-error: true
        run: |
          docker build \
            --target runner \
            --build-arg BACKEND_PORT=3000 \
            -t frota-backend:ci \
            .

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Backend checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          result() {
            if [ "$2" = "success" ]; then
              echo "| $1 | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $1 | ⚠️ $2 |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$1: $2"
            fi
          }

          result "Dependencies" "${{ steps.install.outcome }}"
          result "Prisma schema" "${{ steps.prisma_validate.outcome }}"
          result "Prisma Client" "${{ steps.prisma_generate.outcome }}"
          result "Build" "${{ steps.build.outcome }}"
          result "Entrypoint" "${{ steps.entrypoint.outcome }}"
          result "Lint" "${{ steps.lint.outcome }}"
          result "Tests" "${{ steps.tests.outcome }}"
          result "Docker image" "${{ steps.docker.outcome }}"